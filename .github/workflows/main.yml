name: Build HongMeng Kernel for nova Flip S
on: [push, workflow_dispatch]
env:
  CMAKE_POLICY_DEFAULT_CMP0174: OLD   # 消掉 cmake_parse_arguments 空 SUBDIR 警告
  CMAKE_POLICY_DEFAULT_CMP0177: OLD   # 消掉 install() DESTINATION 警告（日志里也出现了）

jobs:
  build:
    runs-on: ubuntu-22.04     # 22.04 源里有 libtinfo5，省事
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: nova-Flip-S_HarmonyOS-5.1.0
          
      - name: Add swap
        run: |
         sudo swapoff -a || true
         sudo rm -f /swapfile
         sudo fallocate -l 8G /swapfile
         sudo chmod 600 /swapfile
         sudo mkswap /swapfile
         sudo swapon /swapfile
         free -h

      - name: Setup build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libtinfo5 python3 python3-pip cpio cmake gettext ninja-build unzip wget gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Download HarmonyOS Command Line Tools 5.0.3.906
        run: |
          # 从你自己的私有 Release / 网盘 / 内部镜像拉
          # 华为官方站需要登录，无法直接 wget
          wget -O commandline-tools-linux-x64-5.0.3.906.zip \
            "https://contentcenter-vali-drcn.dbankcdn.cn/pvt_2/DeveloperAlliance_package_901_9/95/v3/ksUKbWstTiqarw0qRRlIXQ/commandline-tools-linux-x64-26.0.0.621.zip?HW-CC-KV=V1&HW-CC-Date=20260828T115933Z&HW-CC-Expire=315360000&HW-CC-Sign=3D03D5C410D965FDB5CA5AE8B2BCF961225FA7B2955C1581423EC05464E874FD"
          # 放到 kernel/ 目录（build_tools.sh 会在这里找）
          mkdir -p kernel
          mv commandline-tools-linux-x64-5.0.3.906.zip kernel/

      - name: Run build_tools.sh (prepare toolchain + musl)
        working-directory: kernel    # 关键：切到 kernel/ 子目录
        run: bash build_tools.sh

      - name: Run build.sh (build all modules)
        working-directory: kernel
        run: CONFIG=build.conf bash build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hongmeng-kernel-nova-flip-s
          path: kernel/output/
